services:
  - type: web
    name: clinic-booking
    runtime: python
    plan: free
    branch: main
    autoDeploy: false
    buildCommand: ./build.sh
    preDeployCommand: cd backend && python manage.py migrate && python manage.py seed_clinic
    startCommand: cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: clinic-db
          property: connectionString

databases:
  - name: clinic-db
    plan: free
    databaseName: clinic
    user: clinic
