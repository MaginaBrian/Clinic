services:
  - type: web
    name: mwangaza-clinic
    runtime: python
    plan: free
    region: frankfurt
    autoDeployTrigger: checksPass
    buildCommand: ./build.sh
    startCommand: cd backend && python manage.py migrate && python manage.py seed_clinic && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: mwangaza-clinic-db
          property: connectionString

databases:
  - name: mwangaza-clinic-db
    plan: free
    region: frankfurt
    databaseName: clinic
    user: clinic
